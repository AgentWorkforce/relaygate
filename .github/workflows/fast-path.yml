# Fast path: test and publish an image on Blacksmith runners, outside the
# shared GitHub-hosted queue. Anyone with write access (people or agents) may
# start it; nothing runs until Khaliq approves the fast-path environment.
# It never moves the :main tag: the image is tagged fast-<sha> and sha-<sha>,
# and deployments pin the digest printed in the run summary.
name: fast-path
run-name: fast-path ${{ inputs.ref }} (${{ inputs.reason }})
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build (a PR branch is fine)
        required: true
        default: main
      reason:
        description: Why this needs the fast path
        required: true
permissions:
  contents: read
  packages: write
concurrency:
  group: fast-path-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  test:
    environment: fast-path
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  image:
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/agentworkforce/relaygate:fast-${{ needs.test.outputs.sha }}
            ghcr.io/agentworkforce/relaygate:sha-${{ needs.test.outputs.sha }}
      - name: Summary
        env:
          REF: ${{ inputs.ref }}
          SHA: ${{ needs.test.outputs.sha }}
          REASON: ${{ inputs.reason }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### relaygate fast path"
            echo "- ref: \`$REF\` at \`$SHA\`"
            echo "- reason: $REASON"
            echo "- image: \`ghcr.io/agentworkforce/relaygate@$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
